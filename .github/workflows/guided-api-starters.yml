name: Guided API starter acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/guided-api-starters.yml]

permissions:
  contents: read

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        branch:
          - course-1-tasking
    steps:
      - name: Check out isolated starter
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Build and boot with ESP-IDF 6.0.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32
          path: .
          command: >-
            idf.py set-target esp32 &&
            idf.py build &&
            python "$IDF_PATH/tools/idf_tools.py" --non-interactive install qemu-xtensa &&
            . "$IDF_PATH/export.sh" >/dev/null 2>&1 &&
            script -q -e -c "timeout --kill-after=5s 25s idf.py qemu"
            qemu.log;
            rc=$?;
            { test "$rc" -eq 124 || test "$rc" -eq 137; } &&
            grep -q "EVIDENCE" qemu.log

      - name: Publish boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.branch }}-qemu
          path: qemu.log
          if-no-files-found: warn
